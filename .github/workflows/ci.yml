# Integração contínua do LabTrack: lint, testes e build de cada parte do monorepo.
# Os jobs rodam em paralelo; um PR só está pronto quando todos passam.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, testes e cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Dependências
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (SQLite em memória) com cobertura
        run: pytest --cov --cov-report=term

  backend-postgres:
    name: Backend no PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labtrack
          POSTGRES_PASSWORD: labtrack
          POSTGRES_DB: labtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labtrack -d labtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LABTRACK_TEST_DATABASE_URL: postgresql+psycopg://labtrack:labtrack@localhost:5432/labtrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Dependências
        run: pip install -e ".[dev]"
      - name: Suíte completa no PostgreSQL (migrações, trigger do audit, concorrência)
        run: pytest --postgres

  simulator:
    name: Simulador de instrumentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            instrument-simulator/pyproject.toml
      - name: Dependências (com o backend, para os testes ponta a ponta)
        run: pip install -e "./backend[dev]" -e "./instrument-simulator[dev]"
      - name: Ruff
        working-directory: instrument-simulator
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        working-directory: instrument-simulator
        run: pytest

  frontend:
    name: Frontend (tipos, lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes com cobertura
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build
