# Nginx da interface: arquivos do build, rotas da SPA e proxy para a API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, Swagger e ReDoc: o backend na rede interna do compose.
    location ~ ^/(api/|docs$|redoc$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas da SPA: qualquer caminho sem arquivo volta para o index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
